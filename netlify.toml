[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Codes immer frisch laden, damit Änderungen an codes.json sofort greifen
[[headers]]
  for = "/codes.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "no-cache"

# Bilder, Schriften und Musik ändern sich selten
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/pack.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/pack.css"
  [headers.values]
    Cache-Control = "no-cache"
